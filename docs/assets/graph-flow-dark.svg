<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img"
     aria-label="Every capture lands in the default graph on your disk. Entries you promote are copied into a named shared graph that cannot reference anything you did not promote, and the person you share it with recalls from that graph alone.">
  <rect width="1280" height="420" fill="#121211"/>

  
  <rect x="40" y="70" width="380" height="290" rx="12"
        fill="#1b1b19" stroke="#35342f" stroke-width="1"/>
  <text x="62" y="104" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="650"
        fill="#f3f2ed" letter-spacing="-0.015em">default graph</text>
  <text x="62" y="128" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8d8b83">every capture lands here</text>
  
    <rect x="62" y="156" width="150" height="28" rx="6"
          fill="#232320" stroke="none"
          stroke-width="1" />
    <text x="74" y="175" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13"
          fill="#b9b7af">meeting</text>
    <rect x="222" y="156" width="150" height="28" rx="6"
          fill="#232320" stroke="none"
          stroke-width="1" />
    <text x="234" y="175" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13"
          fill="#b9b7af">incident</text>
    <rect x="62" y="194" width="150" height="28" rx="6"
          fill="#232320" stroke="none"
          stroke-width="1" />
    <text x="74" y="213" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13"
          fill="#b9b7af">decision</text>
    <rect x="222" y="194" width="150" height="28" rx="6"
          fill="#232320" stroke="none"
          stroke-width="1" />
    <text x="234" y="213" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13"
          fill="#b9b7af">note</text>
    <rect x="62" y="232" width="150" height="28" rx="6"
          fill="#232320" stroke="none"
          stroke-width="1" />
    <text x="74" y="251" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13"
          fill="#b9b7af">1:1</text>
    <rect x="222" y="232" width="150" height="28" rx="6"
          fill="#232320" stroke="none"
          stroke-width="1" />
    <text x="234" y="251" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13"
          fill="#b9b7af">hiring</text>
    <rect x="62" y="270" width="150" height="28" rx="6"
          fill="#232320" stroke="none"
          stroke-width="1" />
    <text x="74" y="289" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13"
          fill="#b9b7af">feedback</text>
    <rect x="222" y="270" width="150" height="28" rx="6"
          fill="#232320" stroke="none"
          stroke-width="1" />
    <text x="234" y="289" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13"
          fill="#b9b7af">achievement</text>
  <text x="62" y="342" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#b9b7af">gitignored · its own git repo · never leaves</text>

  
  <line x1="440" y1="205" x2="530" y2="205" stroke="#5ea3f0" stroke-width="2"/>
  <path d="M 530 200 L 540 205 L 530 210 Z" fill="#5ea3f0"/>
  <text x="490" y="189" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13"
        font-weight="600" fill="#8cbef5">you confirm</text>
  <text x="490" y="231" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12"
        fill="#8d8b83">per entry</text>

  
  <rect x="560" y="70" width="380" height="290" rx="12"
        fill="#1b1b19" stroke="#5ea3f0" stroke-width="2"/>
  <text x="582" y="104" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="650"
        fill="#f3f2ed" letter-spacing="-0.015em">platform-team graph</text>
  <text x="582" y="128" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8d8b83">only what you promoted</text>
  
    <rect x="582" y="156" width="150" height="28" rx="6"
          fill="#232320" stroke="none"
          stroke-width="1" />
    <text x="594" y="175" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13"
          fill="#b9b7af">meeting</text>
    <rect x="742" y="156" width="150" height="28" rx="6"
          fill="#232320" stroke="none"
          stroke-width="1" />
    <text x="754" y="175" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13"
          fill="#b9b7af">incident</text>
    <rect x="582" y="194" width="150" height="28" rx="6"
          fill="#232320" stroke="none"
          stroke-width="1" />
    <text x="594" y="213" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13"
          fill="#b9b7af">decision</text>
    <rect x="742" y="194" width="150" height="28" rx="6"
          fill="#232320" stroke="none"
          stroke-width="1" />
    <text x="754" y="213" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13"
          fill="#b9b7af">note</text>
    <rect x="582" y="232" width="150" height="28" rx="6"
          fill="none" stroke="#35342f"
          stroke-width="1" stroke-dasharray="4 3"/>
    <text x="594" y="251" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13"
          fill="#8d8b83">✕  1:1</text>
    <rect x="742" y="232" width="150" height="28" rx="6"
          fill="none" stroke="#35342f"
          stroke-width="1" stroke-dasharray="4 3"/>
    <text x="754" y="251" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13"
          fill="#8d8b83">✕  hiring</text>
    <rect x="582" y="270" width="150" height="28" rx="6"
          fill="none" stroke="#35342f"
          stroke-width="1" stroke-dasharray="4 3"/>
    <text x="594" y="289" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13"
          fill="#8d8b83">✕  feedback</text>
    <rect x="742" y="270" width="150" height="28" rx="6"
          fill="#232320" stroke="none"
          stroke-width="1" />
    <text x="754" y="289" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13"
          fill="#b9b7af">achievement</text>
  <text x="582" y="342" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#b9b7af">self-contained · no reference points outside</text>

  
  <line x1="960" y1="205" x2="1030" y2="205" stroke="#5ea3f0" stroke-width="2"/>
  <path d="M 1030 200 L 1040 205 L 1030 210 Z" fill="#5ea3f0"/>
  <text x="1000" y="189" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13"
        font-weight="600" fill="#8cbef5">hand over</text>
  <text x="1000" y="231" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12"
        fill="#8d8b83">a directory</text>

  <rect x="1060" y="130" width="180" height="170" rx="12" fill="#1b1b19" stroke="#35342f"/>
  <text x="1150" y="180" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="650"
        fill="#f3f2ed" letter-spacing="-0.015em">their agent</text>
  <text x="1150" y="208" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#8d8b83">recalls from</text>
  <text x="1150" y="226" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#8d8b83">that graph alone</text>
  <text x="1150" y="262" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#5bbf6a">✓ nothing else</text>

  <text x="40" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#b9b7af">
    <tspan font-weight="650" fill="#f3f2ed">Private by default.</tspan>
    <tspan fill="#8d8b83">  Capture always lands at home; sharing is a separate, deliberate act.</tspan>
  </text>

  <text x="40" y="395" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#8d8b83">
    ✕ marks what was never promoted — a shared graph is a separate directory on disk, not a filtered view of this one.
  </text>
</svg>
